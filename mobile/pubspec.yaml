name: vibrobraille_hybrid
description: A production-grade haptic Braille accessibility system.
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_local_notifications: ^18.0.0
  vibration: ^3.1.5
  web_socket_channel: ^2.4.0
  qr_flutter: ^4.1.0
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  flutter_tts: ^4.2.5
  camera: 0.10.6
  path_provider: ^2.1.2
  path: ^1.9.0
  flutter_volume_controller: ^1.3.4
  camera_android: 0.10.9+5
  audioplayers: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
